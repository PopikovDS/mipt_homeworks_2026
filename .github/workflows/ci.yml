  final-project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff mypy pyyaml python-dotenv openai types-PyYAML
      - run: cd final_project && ruff check --config ruff.toml .
      - run: cd final_project && mypy src/ tests/ main.py