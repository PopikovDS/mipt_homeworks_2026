name: CI

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: 'Path to package directory'
        required: true
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  final-project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff mypy pyyaml python-dotenv openai types-PyYAML
      - run: cd final_project && ruff check --config ruff.toml .
      - run: cd final_project && mypy --config mypy.ini .