[mypy]
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
follow_imports = silent
python_version = 3.11
warn_return_any = False

[mypy-src.*]
ignore_errors = False

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True